# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json
instances:
  - url: json-jet.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: fern-starter
        repo: ade-v12-747275
        branch: main
      launch: dashboard
title: JSON-JET | Documentation
layout:
  searchbar-placement: header
  page-width: full
navigation:
  - api: Flight Status API
    flattened: false
    layout:
      # hidden: reachable by direct URL and via the in-page nav bar, but kept
      # out of the API reference sidebar so it lists only the API itself.
      - page: Introduction
        path: docs/pages/introduction.mdx
        hidden: true
      - page: CheckIn Demo
        path: docs/pages/checkindemo.mdx
        hidden: true
      - page: Blog
        path: docs/pages/blog.mdx
        hidden: true

# Dark-only palette. Omitting every `light:` key locks the site to dark mode
# and removes the theme toggle, so the published page matches the editor preview.
# Values are pulled from the landing page so Fern's own components sit flush
# against the hero, board, and map panels.
colors:
  accent-primary:
    dark: "#7DD3FC"
  background:
    dark: "#04091A"
  card-background:
    dark: "#0F1B3D"
  border:
    dark: "#1B2A50"
  sidebar-background:
    dark: "#060D22"
  header-background:
    dark: "#060D22"

# Site header links. These render in Fern's own full-width header, so they
# appear on the API reference too, where the content column is far too narrow
# for the in-page nav bar.
navbar-links:
  - type: minimal
    text: Home
    href: /flight-status-api/introduction
  - type: minimal
    text: API Explorer
    href: /flight-status-api/flight-status/get-flight-status
  - type: minimal
    text: Blog
    href: /blog
  - type: minimal
    text: Contact
    href: mailto:api@jsonjetairways.example
  - type: filled
    text: CheckIn Demo
    href: /checkin-demo

theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo.svg
  height: 20
  href: https://buildwithfern.com
favicon: docs/assets/favicon.svg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
